# ===================================================================== F
twobytwo:
  part: twobytwo
  implementation: src/dc_decom_v2/experiments/twobytwo.py
  purpose: "structure {spec, v2} x parameters {paper, v2}, the four channels in every corner"
  corners:
    VV: {structure: v2, parameters: v2, setting: "Setting() = base = bridge B0"}
    VP: {structure: v2, parameters: paper, setting: "Setting(existing=data/parameters_spec,
         structural=data/parameters_v2) (bridge P3-P6 only); R-CN endogenous"}
    SV: {structure: spec, parameters: v2, setting: "R-CN -> R-CN-pub, grid_constraints False, time_mode annual,
         PPA without the curve (ppa_tier1_share 1000, ppa_tier2_share 0, ppa_volume_factor@t 1),
         backup_techs ('cgs',), it_energy legacy_util, certificates False (bridge P1, P2, P7-P11 only)"}
    SP: {structure: spec, parameters: paper, setting: "bridge P11 (all steps)"}
  solves: "REF, C-CN, R-CN (R-CN-pub in the S corners), store_slices=True"
  effects: "extension effect (VP - SP with paper parameters, VV - SV with v2 parameters), parameter update effect
    (SV - SP in the spec structure, VV - VP in the v2 structure), interaction VV - VP - SV + SP. Quantities:
    advantage (points), C-CN and R-CN totals, five channels (cooling, re_procurement, carbon, siting,
    curtailment; decomposition.principled, basis eq1) and shares"
  reference: "spec paper_only (outputs/stage2/paper_only.csv: 4.20%, 3.58% with the subsidy added
    back) vs SP = 'reimplementation difference'"
  checks: "VV = bridge_steps.csv B0, SP = P11 (rel 1e-9); the five channels of each corner sum to C-CN - R-CN"
  outputs: [decomposition_2x2.csv, decomposition_2x2_effects.csv, run_log_2x2.csv]

