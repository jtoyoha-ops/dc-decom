name: reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ tests/

      - name: Type-check
        run: mypy src/dc_decom/ src/dc_decom_v2/ src/dc_decom_spec/ src/dc_decom_analysis/

      - name: Solve the three v1 scenarios
        run: python src/scripts/run_all.py

      - name: Spec version runs (outputs/stage2)
        run: python src/scripts/run_spec.py

      - name: Unit and integration tests
        run: python -m pytest tests/ -q
