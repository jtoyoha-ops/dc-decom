carbon_cert:
  part: carbon_cert
  implementation: src/dc_decom_v2/experiments/carbon_cert.py
  purpose: "carbon price x certificate rule (thesis ch07, amplification)"
  rules:
    cert_on: "certificates = True (base)"
    cert_off: "certificates = False (annual matching)"
    hourly: "certificates = False, ppa_matching = 'hourly' (24/7)"
  prices: "flat from 2026, 0 to 30,000 yen/t step 1,000 (31 points); 2024-2025 at 0"
  solves: [C-CN, R-CN, A0]
  metrics: [advantage (with / without penalty), C-CN curtail_TWh, A0 nonmetro_share 2040,
            A0 nonmetro_share mean 2026-2040, A0 and R-CN co2_cum_Mt, certificate and PPA volumes,
            A0 liquid_share_fleet]
  pstar: "P*_2040(rule): minimum flat price at which A0 reaches the 2040 non-metro share of R-CN solved with the
    same rule and the base carbon path. The sweep brackets the first crossing; bisection to 100 yen/t; 'reached
    at 0' or 'not reached' (0-30,000). P*_mean(rule): the same with the mean share 2026-2040. The price reaching
    the frozen target (49.64%, pstar.json) is also reported per rule"
  siting_effect: "price range in which the A0 share (2040 and mean) moves by more than 0.001 from its value at 0"
  checks: "cert_on equals carbon_sweep.csv (same RunSpec)"
  outputs: [carbon_cert_sweep.csv, pstar_regimes.json, pstar_regimes_curve.csv, run_log_carbon_cert.csv]
